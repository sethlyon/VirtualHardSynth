; midi-patch-display - CYD (ESP32-2432S028R) patch display for a headless
; FluidSynth MIDI rig on a Raspberry Pi.
;
; The CYD is powered and driven over a single USB cable from the Pi.
; No WiFi, no Bluetooth - the ESP32 radio stays off entirely.

[env:cyd]
platform         = espressif32 @ 6.5.0
board            = esp32dev
framework        = arduino
monitor_speed    = 115200
upload_speed     = 921600

; Stock CYD ships a 1MB app partition. huge_app gives us 3MB and no OTA slot,
; which is what we want - this thing flashes over USB.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    ; The registry only carries an untagged alpha of this one, so pull upstream
    ; directly - we need begin(SPIClass&) for the CYD second SPI bus.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson @ ^7.0.4

; TFT_eSPI is configured entirely through build flags so we never have to edit
; files inside .pio/libdeps (which get blown away on a clean build).
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D SMOOTH_FONT=1
