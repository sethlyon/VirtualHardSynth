<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>VHS-1 Sounds</title>
<style>
  :root {
    --bg: #05070a;
    --panel: #12151c;
    --panel-2: #191d27;
    --line: #262b38;
    --line-bright: #3a4257;
    --text: #eef1f6;
    --dim: #7d8496;
    --cyan: #4fd1c5;
    --magenta: #f153ee;
    --warn: #f2b84b;
    --bad: #e5484d;
    --ok: #5fe37e;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding: 0 16px calc(32px + env(safe-area-inset-bottom));
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  main { max-width: 560px; margin: 0 auto; }

  header {
    position: sticky; top: 0; z-index: 5; margin: 0 -16px; padding: 12px 16px 10px;
    background: rgba(5,7,10,.94); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
  .brand h1 em { color: var(--cyan); font-style: normal; }
  .brand a { color: var(--dim); font-size: 13px; text-decoration: none; }
  .now { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .now .info { flex: 1; min-width: 0; }
  .now .name { font-weight: 700; color: var(--cyan); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .sub { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step { width: 44px; height: 44px; flex: none; border-radius: 10px; border: 1px solid var(--line-bright);
    background: var(--panel-2); font-size: 18px; }
  .step:active { background: var(--cyan); color: var(--bg); }

  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
    margin: 24px 0 8px; font-weight: 700; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
  .card.active { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan) inset; }
  .row { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 14px; min-height: 60px; }
  .row .info { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; overflow-wrap: anywhere; }
  .row .meta { font-size: 13px; color: var(--dim); }
  .badge { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    color: var(--bg); background: var(--cyan); border-radius: 999px; padding: 2px 8px; }

  .btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-bright);
    background: var(--panel-2); font-weight: 600; flex: none; }
  .btn.primary { background: var(--cyan); border-color: var(--cyan); color: var(--bg); }
  .btn.danger { color: var(--bad); }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--dim); padding: 0 10px; }
  .btn:disabled { opacity: .45; }

  .presets { border-top: 1px solid var(--line); padding: 10px 12px 12px; }
  .presets input { width: 100%; min-height: 44px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--line-bright); background: var(--bg); margin-bottom: 8px; }
  .plist { max-height: 55vh; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
  .preset { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left;
    min-height: 44px; padding: 6px 8px; border: 0; border-radius: 8px; background: transparent; }
  .preset .num { font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--dim); flex: none; width: 56px; }
  .preset.on { background: rgba(79,209,197,.14); color: var(--cyan); font-weight: 600; }
  .preset:active { background: var(--panel-2); }

  form.url { display: grid; gap: 8px; padding: 12px; }
  form.url input { min-height: 44px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--line-bright); background: var(--bg); width: 100%; }
  .hint { font-size: 13px; color: var(--dim); margin: 0; }

  #toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    max-width: 528px; margin: 0 auto; padding: 12px 14px; border-radius: 12px;
    background: var(--panel-2); border: 1px solid var(--line-bright); z-index: 10;
    transform: translateY(150%); transition: transform .2s; }
  #toast.show { transform: none; }
  #toast.bad { border-color: var(--bad); color: #ffb4b6; }
  #toast.ok { border-color: var(--ok); }
  .spin { display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px;
    border: 2px solid var(--line-bright); border-top-color: var(--cyan); border-radius: 50%;
    animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } #toast { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <h1>VHS-1 <em>Sounds</em></h1>
      <a href="/">Full control surface &rsaquo;</a>
    </div>
    <div class="now">
      <button class="step" id="prev" aria-label="Previous patch">&lsaquo;</button>
      <div class="info">
        <div class="name" id="nowName">&hellip;</div>
        <div class="sub" id="nowSub">connecting</div>
      </div>
      <button class="step" id="next" aria-label="Next patch">&rsaquo;</button>
    </div>
  </header>

  <h2>Your soundfonts</h2>
  <div id="mine"><p class="hint">Loading&hellip;</p></div>

  <h2>Add a soundfont</h2>
  <div id="curated"></div>

  <div class="card">
    <form class="url" id="urlForm">
      <div class="title">From a link</div>
      <input id="url" type="url" inputmode="url" placeholder="https://&hellip;/something.sf2" required>
      <input id="urlName" placeholder="Name (optional)" maxlength="40">
      <button class="btn primary" type="submit">Download &amp; play</button>
      <p class="hint">Any direct link to an .sf2 file, up to 300&nbsp;MB. It becomes the active sound set; the previous one is kept.</p>
    </form>
  </div>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const CURATED = {{ curated | tojson }};

let fonts = {};          // alias -> {name, path, presets}
let patches = [];        // the active patch table
let activeAlias = null;  // soundfont the patch table uses, if it's just one
let state = null;        // bridge state: bank/prog/name/soundfont
let openAlias = null;    // whose preset list is expanded
let busy = false;

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok || body.error) throw new Error(body.error || res.statusText);
  return body;
}
const postJSON = (path, obj) => api(path, {
  method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj || {}),
});
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad3 = n => String(n).padStart(3, '0');

let toastTimer;
function toast(msg, kind, sticky) {
  const t = document.getElementById('toast');
  t.className = 'show ' + (kind || '');
  t.innerHTML = kind === 'busy' ? '<span class="spin"></span>' + esc(msg) : esc(msg);
  clearTimeout(toastTimer);
  if (!sticky) toastTimer = setTimeout(() => t.className = '', kind === 'bad' ? 6000 : 2500);
}

// Long-running: one at a time, everything else disabled meanwhile.
async function work(label, fn) {
  if (busy) return;
  busy = true; render();
  toast(label, 'busy', true);
  try {
    const msg = await fn();
    toast(msg || 'Done', 'ok');
  } catch (e) {
    toast(e.message, 'bad');
  } finally {
    busy = false;
    await refresh();
  }
}

async function refresh() {
  try {
    [fonts, patches] = await Promise.all([api('/api/soundfonts'), api('/api/patches')]);
  } catch (e) {
    toast('Could not reach the synth: ' + e.message, 'bad');
  }
  const used = [...new Set(patches.map(p => p.soundfont))];
  activeAlias = used.length === 1 ? used[0] : null;
  if (openAlias === null) openAlias = activeAlias;
  render();
  pollState();
}

async function pollState() {
  try {
    state = await api('/api/state');
  } catch (e) {
    state = null;
  }
  renderNow();
}

function renderNow() {
  const name = document.getElementById('nowName'), sub = document.getElementById('nowSub');
  if (!state) { name.textContent = 'Synth not responding'; sub.textContent = 'retrying…'; return; }
  name.textContent = state.name || '–';
  sub.textContent = `${state.soundfont || ''} · bank ${pad3(state.bank)} · prog ${pad3(state.prog)}`;
  document.querySelectorAll('.preset').forEach(b =>
    b.classList.toggle('on', +b.dataset.bank === state.bank && +b.dataset.prog === state.prog));
}

function render() {
  const mine = document.getElementById('mine');
  const aliases = Object.keys(fonts).sort((a, b) =>
    (b === activeAlias) - (a === activeAlias) || fonts[a].name.localeCompare(fonts[b].name));
  mine.innerHTML = aliases.length ? '' : '<p class="hint">None yet.</p>';
  for (const alias of aliases) {
    const f = fonts[alias], active = alias === activeAlias, open = alias === openAlias && active;
    const card = document.createElement('div');
    card.className = 'card' + (active ? ' active' : '');
    card.innerHTML = `
      <div class="row">
        <div class="info">
          <div class="title">${esc(f.name)} ${active ? '<span class="badge">Playing</span>' : ''}</div>
          <div class="meta">${f.presets.length} presets</div>
        </div>
        ${active
          ? `<button class="btn" data-act="toggle">${open ? 'Hide' : 'Presets'}</button>`
          : `<button class="btn primary" data-act="use" ${busy ? 'disabled' : ''}>Use</button>`}
        ${active ? '' : `<button class="btn quiet danger" data-act="del" aria-label="Remove ${esc(f.name)}" ${busy ? 'disabled' : ''}>✕</button>`}
      </div>`;
    if (open) card.appendChild(presetList());
    card.querySelector('[data-act="use"]')?.addEventListener('click', () => useFont(alias));
    card.querySelector('[data-act="del"]')?.addEventListener('click', () => delFont(alias));
    card.querySelector('[data-act="toggle"]')?.addEventListener('click', () => {
      openAlias = open ? '' : alias; render(); renderNow();
    });
    mine.appendChild(card);
  }

  const cur = document.getElementById('curated');
  cur.innerHTML = '';
  for (const c of CURATED) {
    const have = c.key in fonts;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="row">
        <div class="info"><div class="title">${esc(c.name)}</div><div class="meta">${esc(c.size)}</div></div>
        ${have
          ? '<span class="meta">Added</span>'
          : `<button class="btn" ${busy ? 'disabled' : ''}>Add</button>`}
      </div>`;
    card.querySelector('button')?.addEventListener('click', () => addFont(c.key, c.name, c.url));
    cur.appendChild(card);
  }
  document.querySelector('#urlForm button').disabled = busy;
}

function presetList() {
  const wrap = document.createElement('div');
  wrap.className = 'presets';
  wrap.innerHTML = `<input type="search" placeholder="Filter ${patches.length} presets" aria-label="Filter presets"><div class="plist"></div>`;
  const list = wrap.querySelector('.plist');
  const sorted = [...patches].sort((a, b) => a.bank - b.bank || a.prog - b.prog);
  const draw = q => {
    q = q.trim().toLowerCase();
    list.innerHTML = sorted
      .filter(p => !q || p.name.toLowerCase().includes(q) || `${p.bank}:${p.prog}`.includes(q))
      .map(p => `<button class="preset" data-bank="${p.bank}" data-prog="${p.prog}">
                   <span class="num">${pad3(p.bank)}:${pad3(p.prog)}</span><span>${esc(p.name)}</span></button>`)
      .join('');
    renderNow();
  };
  wrap.querySelector('input').addEventListener('input', e => draw(e.target.value));
  list.addEventListener('click', async e => {
    const b = e.target.closest('.preset');
    if (!b) return;
    try {
      state = await postJSON('/api/control', { action: 'patch_select', bank: +b.dataset.bank, prog: +b.dataset.prog });
      renderNow();
    } catch (err) { toast(err.message, 'bad'); }
  });
  draw('');
  return wrap;
}

function useFont(alias) {
  const name = fonts[alias].name;
  openAlias = alias;
  work(`Switching to ${name}…`, async () => {
    const r = await postJSON(`/api/soundfonts/${encodeURIComponent(alias)}/activate`);
    return `Playing ${name} · ${r.preset_count} presets`;
  });
}

function delFont(alias) {
  const name = fonts[alias].name;
  if (!confirm(`Remove ${name} from the synth?`)) return;
  work(`Removing ${name}…`, async () => {
    await api(`/api/soundfonts/${encodeURIComponent(alias)}`, { method: 'DELETE' });
    return `Removed ${name}`;
  });
}

function addFont(alias, name, url) {
  openAlias = alias;
  work(`Downloading ${name}… (big files take a while)`, async () => {
    const r = await postJSON('/api/soundfonts', { alias, name, url });
    return `Playing ${name} · ${r.preset_count} presets`;
  });
}

document.getElementById('urlForm').addEventListener('submit', e => {
  e.preventDefault();
  const url = document.getElementById('url').value.trim();
  const file = decodeURIComponent(url.split(/[?#]/)[0].split('/').pop() || 'soundfont').replace(/\.sf[23]$/i, '');
  const name = document.getElementById('urlName').value.trim() || file;
  let alias = name.toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'soundfont';
  for (let n = 2; alias in fonts; n++) alias = alias.replace(/-\d+$/, '').slice(0, 36) + '-' + n;
  addFont(alias, name, url);
  e.target.reset();
});

async function step(action) {
  try { state = await postJSON('/api/control', { action }); renderNow(); }
  catch (e) { toast(e.message, 'bad'); }
}
document.getElementById('prev').addEventListener('click', () => step('patch_prev'));
document.getElementById('next').addEventListener('click', () => step('patch_next'));

refresh();
// Keep "now playing" honest when the keyboard or the panel changes patch.
setInterval(() => { if (!document.hidden) pollState(); }, 3000);
</script>
</body>
</html>
